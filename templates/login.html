        .glow-card { position: relative; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

            content: ''; position: absolute; top: var(--mouse-y, 50%); left: var(--mouse-x, 50%);

            background: radial-gradient(circle, rgba(220, 38, 38, 0.1) 0%, transparent 60%); 
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 0;
        }
        .dark .glow-card::before { background: radial-gradient(circle, rgba(220, 38, 38, 0.15) 0%, transparent 60%); }
        .glow-card:hover::before { opacity: 1; }
        .glow-card > * { position: relative; z-index: 1; }

        @keyframes zoomInUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-zoom-in { animation: zoomInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

<body class="bg-gray-50 dark:bg-darkBg text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between p-6 bg-grid-light transition-colors">

        </button>

            <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
        </button>
    </header>

    <main class="flex-1 flex items-center justify-center my-auto">
        <div class="w-full max-w-md animate-zoom-in">
            <div class="relative overflow-hidden border border-gray-200 dark:border-gray-700 rounded-[36px] bg-white dark:bg-darkCard shadow-xl p-10 flex flex-col justify-center glow-card">
                
                <div class="text-center mb-10">
                    <div class="flex justify-center mb-4">
                        <div class="w-16 h-16 bg-[#690991] rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(105,9,145,0.4)]">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 671.14 514.29" class="w-10 h-10 fill-current text-white">
                                <path d="M517.17,230.82,620.56,94.91a5.48,5.48,0,0,0-4.37-8.8H536.61a5.47,5.47,0,0,0-4.4,2.21l-59.66,80.2a5.48,5.48,0,0,1-8.84-.05s-26.53-35.94-49.29-67.71c-6.48-9.05-16.38-12-27.42-13.47-21.43-2.86-53.74,1.27-53.86,1.28-193.59,24.5-296.23,135.12-317,158a5.49,5.49,0,0,0,.49,7.83c128.48,111.9,275.62,131.39,345.21,134.45,0,0,33.44.47,39.19-5.87.49-.54,1-1.06,1.43-1.64,6.59-8.79,58.92-79.17,58.92-79.17a5.48,5.48,0,0,1,8.86.08l60.27,84.29A5.48,5.48,0,0,0,535,388.8h76.61a10,10,0,0,0,8-16.07L517.16,237.45A5.49,5.49,0,0,1,517.17,230.82ZM351.73,322.93a5.35,5.35,0,0,1-6.22,1.72l0,0a84.63,84.63,0,0,1-29.27-19.37,89.65,89.65,0,0,1-19.38-30.12A102.31,102.31,0,0,1,289.88,237q0-21.06,6.94-38.33a90.09,90.09,0,0,1,19.38-29.9,84.05,84.05,0,0,1,25.07-17.57c1-.46,2.09-.93,3.16-1.35s2.06-.8,3.11-1.17a5.51,5.51,0,0,1,6.24,1.87l61.67,82.23a5.49,5.49,0,0,1,0,6.62Z"/>
                            </svg>
                        </div>
                    </div>
                    <h1 data-i18n="login-title" class="text-3xl font-bold text-[#690991] dark:text-[#c75ced]">Acceso Clientes</h1>
                    <p data-i18n="login-subtitle" class="text-gray-600 dark:text-gray-400 mt-2 text-sm">Portal corporativo Qxao</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label data-i18n="login-label-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Correo corporativo</label>
                        <input type="email" id="login-email" class="w-full px-5 py-4 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-2xl focus:outline-none focus:border-[#690991] dark:focus:border-[#c75ced] dark:text-white transition" placeholder="cliente@empresa.com" required>
                    </div>
                    <div>
                        <label data-i18n="login-label-pass" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Contraseña</label>
                        <input type="password" id="login-password" class="w-full px-5 py-4 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-2xl focus:outline-none focus:border-[#690991] dark:focus:border-[#c75ced] dark:text-white transition" placeholder="••••••••" required>
                    </div>

                    <p id="error-message" class="hidden text-red-500 text-sm text-center font-medium"></p>

                    <button type="submit" id="btn-submit" data-i18n="login-btn" class="w-full bg-[#690991] hover:bg-[#4a0066] text-white py-4 rounded-2xl font-bold text-lg transition shadow-lg shadow-[#690991]/30">
                        Ingresar a mi Panel
                    </button>
                </form>

                <div class="mt-8 text-center relative z-20">
                    <a href="index.html" data-i18n="login-back" class="text-sm text-gray-500 hover:text-[#690991] dark:hover:text-[#c75ced] transition font-medium">← Volver al inicio</a>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <script>
        const translations = {
            es: { "login-title": "Acceso Clientes", "login-subtitle": "Portal corporativo Qxao", "login-label-email": "Correo corporativo", "login-label-pass": "Contraseña", "login-btn": "Ingresar a mi Panel", "login-back": "← Volver al inicio" },
            en: { "login-title": "Client Access", "login-subtitle": "Qxao Corporate Portal", "login-label-email": "Corporate email", "login-label-pass": "Password", "login-btn": "Access my Dashboard", "login-back": "← Back to home" }
        };

        let currentLang = 'es';
        const langToggleBtn = document.getElementById('lang-toggle');

        function translatePage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) { el.textContent = translations[currentLang][key]; }
            });
        }

        if (langToggleBtn) {
            langToggleBtn.addEventListener('click', () => {
                currentLang = currentLang === 'es' ? 'en' : 'es';
                langToggleBtn.innerHTML = currentLang === 'es' ? 'ES <span class="opacity-40">|</span> EN' : '<span class="opacity-40">ES |</span> EN';
                translatePage();
            });
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            if(themeToggleLightIcon) themeToggleLightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            if(themeToggleDarkIcon) themeToggleDarkIcon.classList.remove('hidden');
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', function() {
                if(themeToggleDarkIcon) themeToggleDarkIcon.classList.toggle('hidden');
                if(themeToggleLightIcon) themeToggleLightIcon.classList.toggle('hidden');

                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            });
        }

        document.querySelectorAll('.glow-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('error-message');
            const btn = document.getElementById('btn-submit');
            errorMsg.classList.add('hidden');
            btn.textContent = currentLang === 'es' ? "Verificando acceso..." : "Verifying access...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/login/client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: document.getElementById('login-email').value, 
                        password: document.getElementById('login-password').value 
                    }),
                    credentials: 'include' 
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    // SEPARAMOS LA VARIABLE DEL CLIENTE
                    localStorage.setItem('client_name', data.user_name);
                    localStorage.setItem('client_company', data.company);
                    localStorage.setItem('client_role', 'cliente'); 
                    
                    btn.textContent = currentLang === 'es' ? "¡Acceso Concedido!" : "Access Granted!";
                    btn.classList.add('bg-green-600');
                    setTimeout(() => window.location.href = "dashboard.html", 600);
                } else {
                    errorMsg.textContent = data.detail || (currentLang === 'es' ? "Credenciales incorrectas." : "Incorrect credentials.");
                    errorMsg.classList.remove('hidden');
                    btn.textContent = translations[currentLang]["login-btn"];
                    btn.disabled = false;
                }
            } catch (error) {
                errorMsg.textContent = currentLang === 'es' ? "No se pudo conectar con el servidor." : "Could not connect to the server.";
                errorMsg.classList.remove('hidden');
                btn.textContent = translations[currentLang]["login-btn"];
                btn.disabled = false;
            }
        });            
    </script>
</body>
